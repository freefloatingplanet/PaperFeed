name: arXiv Abstracts JA (DeepL)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"  # 毎日 11:17 JST 相当（任意に変更）

permissions:
  contents: write

concurrency:
  group: arxiv-abstracts-ja
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # PR由来ではSecrets未使用で安全側に倒す

    env:
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      USER_AGENT: ${{ secrets.USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: aggregator
        run: |
          python -m src.aggregator

      - name: translator (DeepL)
        run: |
          python -m src.translator

      - name: publisher
        run: |
          python -m src.publisher

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ || true
          git diff --quiet && echo "no changes" || git commit -m "chore: update site $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

